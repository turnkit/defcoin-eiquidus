<svg xmlns="http://www.w3.org/2000/svg" width="486" height="261" viewBox="0 0 486 261" role="img" aria-labelledby="title desc">
  <title id="title">Defcoin Paper Wallet Artwork</title>
  <desc id="desc">Printable Defcoin paper wallet background with public-address and private-key zones.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08131d"/>
      <stop offset="55%" stop-color="#13121d"/>
      <stop offset="100%" stop-color="#231620"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#dbe5ef"/>
    </linearGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f6fa8"/>
      <stop offset="100%" stop-color="#5ea4d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="486" height="261" rx="18" fill="url(#bg)"/>
  <rect x="8" y="8" width="470" height="245" rx="14" fill="none" stroke="#8fa8bf" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="243" cy="128" r="102" fill="#c8d7e6" opacity="0.06"/>
  <circle cx="243" cy="128" r="86" fill="#dde7f2" opacity="0.07"/>

  <rect x="16" y="20" width="454" height="28" rx="10" fill="url(#banner)" opacity="0.95"/>
  <text x="30" y="39" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DEFCOIN PAPER WALLET</text>
  <text x="456" y="39" text-anchor="end" fill="#f3f8fd" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DFC COLD STORAGE</text>

  <rect x="14" y="46" width="128" height="169" rx="16" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="344" y="94" width="128" height="127" rx="16" fill="url(#panel)" filter="url(#shadow)"/>

  <rect x="24" y="56" width="108" height="22" rx="8" fill="#19334c"/>
  <text x="78" y="71" text-anchor="middle" fill="#f3f8fd" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">RECEIVE DFC</text>

  <rect x="354" y="104" width="108" height="22" rx="8" fill="#5d1f27"/>
  <text x="408" y="119" text-anchor="middle" fill="#fff6f1" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SPEND DFC</text>

  <rect x="153" y="66" width="180" height="124" rx="20" fill="#0d1722" fill-opacity="0.72" stroke="#8eb4d3" stroke-opacity="0.24"/>
  <text x="243" y="88" text-anchor="middle" fill="#ffdd5e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3">DEFCOIN</text>
  <text x="243" y="104" text-anchor="middle" fill="#eaf2f8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">DFC</text>
  <text x="243" y="203" text-anchor="middle" fill="#d7e6f2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">OFFLINE KEY RECORD</text>
  <text x="243" y="219" text-anchor="middle" fill="#9db5c8" font-family="Arial, Helvetica, sans-serif" font-size="10">Print and store offline.</text>

  <text x="24" y="243" fill="#a9bfd1" font-family="Arial, Helvetica, sans-serif" font-size="10">Keep two offline copies.</text>
  <text x="462" y="243" text-anchor="end" fill="#a9bfd1" font-family="Arial, Helvetica, sans-serif" font-size="10">defcoin.dc903.org</text>

  <circle cx="34" cy="130" r="16" fill="#15283b" stroke="#8fb7d6" stroke-opacity="0.5"/>
  <text x="34" y="135" text-anchor="middle" fill="#ffdc68" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">DFC</text>
  <circle cx="452" cy="66" r="13" fill="#15283b" stroke="#e4b198" stroke-opacity="0.5"/>
  <text x="452" y="71" text-anchor="middle" fill="#ffd9cb" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">DFC</text>
</svg>
